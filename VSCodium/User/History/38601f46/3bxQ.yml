version: "3.9"

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Neon connection string in Portainer stack env}
      TENANT_DEV_FALLBACK: ${TENANT_DEV_FALLBACK:-false}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY:?set PLATFORM_ADMIN_KEY in Portainer stack env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Portainer stack env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in Portainer stack env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in Portainer stack env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in Portainer stack env}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?set R2_BUCKET_NAME in Portainer stack env}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?set R2_PUBLIC_BASE_URL in Portainer stack env}
    # No published port — cloudflared reaches it over the internal
    # compose network. Nothing exposed on the host/firewall at all.


