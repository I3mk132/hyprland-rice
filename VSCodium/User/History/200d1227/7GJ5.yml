# Backend API only — for deploying just the FastAPI service (e.g. from
# Portainer with "Compose path: docker-compose.backend.yml").
#
# Secrets/config come from the deployment's environment variables (in
# Portainer: the "Environment variables" section of the stack), not from
# backend/.env — that file is gitignored so it doesn't exist in a git deploy.
#
#   SECRET_KEY              required — long random string
#   DATABASE_URL            required — Neon Postgres pooled connection string
#                           (postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/db?sslmode=require)
#   FRONTEND_ORIGINS        comma-separated origins allowed to call the API
#                           (the Cloudflare Pages URL + each tenant custom domain)
#   FRONTEND_ORIGIN_REGEX   regex for per-tenant frontend domains (optional)
#   DEFAULT_TENANT_SLUG     set to "" in production (unknown domains -> 404)
#   R2_*                    Cloudflare R2 image storage (all 5 required for R2;
#                           leave empty only for local-disk dev)
#

services:
  backend:
    build: ./backend
    pull_policy: build
    restart: unless-stopped
    container_name: dental-api

    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in the stack's environment variables}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Neon connection string}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      FRONTEND_ORIGIN_REGEX: ${FRONTEND_ORIGIN_REGEX:-https?://([a-z0-9-]+\.)?localhost(:\d+)?}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - default
      - cf-tunnel-net

networks:
  cf-tunnel-net:
    external: true

