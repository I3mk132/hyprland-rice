[main]
gtk-theme=Adwaita-dark        # Set the base GTK theme
style=~/.config/gtklock/style.css  # Link your Gruvbox CSS
background=~/Pictures/wall.png # Set your wallpaper
time-format=%H:%M              # 24-hour clock
date-format=%A, %d %B          # Full date format
idle-hide=true                 # Hide input field when not typing
modules=userinfo-module        # Enable plugins (like your profile pic)