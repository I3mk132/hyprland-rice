# ==========================================
# HYPRLOCK CONFIGURATION - GRUVBOX THEME
# ==========================================

# --- BACKGROUND ---
# خلفية شفافة مبلورة تأخذ لقطة للشاشة وتطبق عليها تأثير الضباب
background {
    monitor =
    path = screenshot
    color = rgba(40, 40, 40, 0.8) # لون Gruvbox داكن مع شفافية
    blur_passes = 2 # عدد تمريرات تأثير الضباب
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- CLOCK (الساعة الكبيرة) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(235, 219, 178, 1.0) # لون Gruvbox الفاتح للنص (Foreground)
    font_size = 100
    font_family = JetBrains Mono Nerd Font, Bold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# --- DATE (التاريخ الصغير) ---
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +"%A, %d %B %Y")</b>"
    color = rgba(213, 196, 161, 1.0) # لون Gruvbox مائل للبيج قليلاً
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, -10
    halign = center
    valign = center
    shadow_passes = 1
}

# --- INPUT BOX (صندوق الكتابة مع الأنيميشن) ---
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25 # حجم النقاط عند الكتابة
    dots_spacing = 0.2 # المسافة بين النقاط
    dots_center = true
    dots_rounding = -1 
    
    # ألوان الصندوق (Gruvbox Colors)
    outer_color = rgba(80, 73, 69, 1.0) # إطار الصندوق
    inner_color = rgba(40, 40, 40, 0.8) # خلفية الصندوق
    font_color = rgba(235, 219, 178, 1.0) # لون النص/النقاط
    
    # الأنيميشن والتفاعل
    fade_on_empty = true # يختفي الصندوق إذا كان فارغاً
    fade_timeout = 1000 # مدة الاختفاء بالملي ثانية
    placeholder_text = <i>Type Password...</i> # النص المؤقت
    hide_input = false
    rounding = -1 # زوايا دائرية بالكامل
    
    # تفاعلات الألوان (الأنيميشن)
    check_color = rgba(250, 189, 47, 1.0) # أصفر (Gruvbox Yellow) عند التحقق من الرمز
    fail_color = rgba(251, 73, 52, 1.0) # أحمر (Gruvbox Red) إذا كان الرمز خطأ
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # النص عند الخطأ
    fail_transition = 300 # سرعة انتقال اللون عند الخطأ (أنيميشن)
    
    position = 0, -120
    halign = center
    valign = center
}
