#####################
### Look and Feel ###
#####################

# Source Matugen-generated colors
source = ~/.config/hypr/look/colors.conf


general {
    gaps_in = 4
    gaps_out = 6

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border   = rgba($primary_containeraa) rgba($primary55) 45deg
    col.inactive_border = rgba($outline_variant22)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
       enabled = true
       range = 15
       render_power = 1
       color         = rgba($secondary_containercc)
       color_inactive = rgba($surface_dim55)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}
