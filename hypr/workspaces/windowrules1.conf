
##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# === rofi animation
layerrule = match:namespace ^(rofi)$, blur off
layerrule = match:namespace ^(rofi)$, animation popin 60%

# === swaync
layerrule = animation slide right, match:namespace ^(swaync-control-center)$
layerrule = 
# === Picture in picture 
windowrule {
    name = hover-pip
    match:title = ^(Picture in picture)$
    
    float = on
    pin = off
    # Position: bottom-right (monitor width - window width - margin)
    move = (monitor_w-295) (monitor_h-175)
    size = 284 160
    stay_focused = off
}


windowrule {
    name = thunar-opacity
    match:class = ^(Thunar)$
    opacity = 0.80 0.80
}


